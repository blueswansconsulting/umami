services:
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    environment:
      DATABASE_URL: postgresql://umami:${DATABASE_PASSWORD}@umami-db:5432/umami
      CLIENT_IP_HEADER: x-visitor-ip
      APP_SECRET: ${APP_SECRET}
    networks:
      umami_internal: {}
      kamal:
        ipv4_address: 172.18.0.15
    depends_on:
      umami-db:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  umami-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    networks:
      - umami_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

networks:
  umami_internal:
    driver: bridge
  kamal:
    external: true

volumes:
  umami-db-data:
