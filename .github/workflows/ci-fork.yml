name: Fork CI

on: [push, pull_request]

env:
  DATABASE_URL: "postgresql://user:pass@localhost:5432/dummy"
  SKIP_DB_CHECK: 1

jobs:
  build:
    # Upstream's ci.yml only runs in umami-software/umami; this mirrors it for forks.
    if: github.repository != 'umami-software/umami'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm test
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
